workflows:
  android apk build:
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Fix Android project
        script: flutter create . --project-name saathiya_app --platforms=android
      - name: Set Firebase package name
        script: |
          sed -i 's/applicationId = ".*"/applicationId = "com.saathiya.app"/' android/app/build.gradle || sed -i 's/applicationId ".*"/applicationId "com.saathiya.app"/' android/app/build.gradle
          ls android/app/google-services.json
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
